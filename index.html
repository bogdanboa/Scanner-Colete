<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanare retururi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --ink: #10142B;
    --ink-soft: #666F8B;
    --line: #E4E6F1;
    --brand: #3450E0;
    --success: #0E9F6E;
    --success-soft: #E1F6EE;
    --danger: #D8354A;
    --danger-soft: #FBE7EA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #0B0D18;
    color: #fff;
    font-family: 'Inter', -apple-system, Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .top {
    padding: 16px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #8CA0FF;
    font-weight: 600;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 12px;
  }
  .name-box input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 12px;
    border: none;
    font-family: 'Inter', sans-serif;
  }
  .start-btn {
    width: 100%;
    background: var(--brand);
    color: #fff;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    margin-top: 12px;
  }
  #reader {
    width: 100%;
    flex: 1;
    display: none;
  }
  #reader.show { display: block; }
  #reader video { width: 100% !important; }
  .feedback {
    position: fixed;
    left: 16px; right: 16px; bottom: 16px;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .feedback.show { opacity: 1; }
  .feedback.success { background: var(--success); }
  .feedback.error { background: var(--danger); }
  .feedback.info { background: var(--brand); }
  .log {
    padding: 12px 16px 90px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .log-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .log-item .ok { color: #4ADE9C; }
  .log-item .no { color: #FF7A8A; }
</style>
</head>
<body>
  <div class="top">
    <div class="eyebrow">FAN COURIER · SCANARE RAPIDA</div>
    <h1>Scaneaza retururile</h1>
    <div class="name-box">
      <input id="numeInput" placeholder="Numele tau (ex. Ana)" />
    </div>
    <button class="start-btn" id="startBtn" onclick="startScanning()">📷 Porneste scanarea</button>
  </div>

  <div id="reader"></div>
  <div id="log" class="log"></div>
  <div id="feedback" class="feedback"></div>

<script>
  // ↓↓↓ INLOCUIESTE cu link-ul aplicatiei tale (cel care se termina in /exec) ↓↓↓
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbzuT48Ej6Ne7VIWIsrdhdtzfMldUiyIcaVXlvu8lxhcYQkh5VrFCXmXrJkVveuPQmVi/exec';

  const nameInput = document.getElementById('numeInput');
  nameInput.value = localStorage.getItem('scanner_nume') || '';
  nameInput.addEventListener('input', function () {
    localStorage.setItem('scanner_nume', nameInput.value);
  });

  let scanner = null;
  let lastScanned = {};
  const logEl = document.getElementById('log');

  function startScanning() {
    const nume = nameInput.value.trim();
    if (!nume) {
      alert('Scrie-ti numele mai sus, ca sa stim cine a bifat coletele.');
      return;
    }
    document.getElementById('startBtn').style.display = 'none';
    const reader = document.getElementById('reader');
    reader.classList.add('show');
    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 140 } },
      onScanSuccess,
      function () {}
    ).catch(function (err) {
      showFeedback('Eroare camera: ' + (err && err.message ? err.message : err), 'error');
    });
  }

  function onScanSuccess(decodedText) {
    const awb = (decodedText || '').trim();
    const now = Date.now();
    if (lastScanned[awb] && now - lastScanned[awb] < 4000) return;
    lastScanned[awb] = now;

    const nume = nameInput.value.trim();
    showFeedback('Se trimite ' + awb + '...', 'info');

    const url = EXEC_URL + '?action=markReceivedByAwb&awb=' + encodeURIComponent(awb) + '&by=' + encodeURIComponent(nume);
    fetch(url, { mode: 'no-cors' })
      .then(function () {
        showFeedback('✓ ' + awb + ' trimis', 'success');
        addLog(awb, true);
      })
      .catch(function () {
        showFeedback('✕ Eroare de retea la ' + awb, 'error');
        addLog(awb, false);
      });
  }

  function addLog(awb, ok) {
    const item = document.createElement('div');
    item.className = 'log-item';
    const time = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    item.innerHTML = '<span>' + awb + '</span><span class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✕ ') + time + '</span>';
    logEl.insertBefore(item, logEl.firstChild);
  }

  function showFeedback(msg, type) {
    const el = document.getElementById('feedback');
    el.textContent = msg;
    el.className = 'feedback show ' + type;
    clearTimeout(window._fbTimer);
    window._fbTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
</script>
</body>
</html>
